[package]
name = "stark-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
dotenvy = "0.15.7"
futures = "0.3.34"
hound = "3.5.1"
oww-rs = "0.3.3"
ort = "=2.0.0-rc.10"
reqwest = { version = "0.13.5", features = ["multipart", "json", "stream"] }
ringbuf = "0.5.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serial2-tokio = "0.1.25"
silero-vad-rust = "6.2.2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
schemars = "1.2.2"
hex = "0.4.3"
toml = "1.2.0"
chrono = "0.4.45"
yup-oauth2 = "12.1.2"
hyper-util = "0.1.21"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs"] }
async-stream = "0.3.6"
tokio-stream = { version = "0.1.19", features = ["sync"] }

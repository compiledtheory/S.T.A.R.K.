[package]
name = "stark-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serial2-tokio = "0.1.25"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
